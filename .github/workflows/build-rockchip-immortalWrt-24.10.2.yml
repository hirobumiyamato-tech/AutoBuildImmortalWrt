name: build-rockchip-immortalWrt-24.10.2

on:
  workflow_dispatch:
    inputs:
      profile:
        type: choice
        description: |
          输入 软路由型号 可选值如下：
        options:
          - ariaboard_photonicat
          - armsom_sige3
          - armsom_sige7
          - cyber_cyber3588-aib
          - ezpro_mrkaio-m68s
          - firefly_roc-rk3328-cc
          - firefly_roc-rk3568-pc
          - friendlyarm_nanopc-t4
          - friendlyarm_nanopc-t6
          - friendlyarm_nanopi-r2c
          - friendlyarm_nanopi-r2c-plus
          - friendlyarm_nanopi-r2s
          - friendlyarm_nanopi-r3s
          - friendlyarm_nanopi-r4s
          - friendlyarm_nanopi-r4se
          - friendlyarm_nanopi-r4s-enterprise
          - friendlyarm_nanopi-r5c
          - friendlyarm_nanopi-r5s
          - friendlyarm_nanopi-r6c
          - friendlyarm_nanopi-r6s
          - huake_guangmiao-g4c
          - lunzn_fastrhino-r66s
          - lunzn_fastrhino-r68s
          - lyt_t68m
          - pine64_rock64
          - pine64_rockpro64
          - radxa_cm3_io
          - radxa_e25
          - radxa_rock-3a
          - radxa_rock-3b
          - radxa_rock-3c
          - radxa_rock-5a
          - radxa_rock-5b
          - radxa_rock-pi-4a
          - radxa_rock-pi-e
          - radxa_rock-pi-s
          - radxa_zero-3e
          - radxa_zero-3w
          - sinovoip_bpi-r2-pro
          - xunlong_orangepi-5
          - xunlong_orangepi-5-plus
          - xunlong_orangepi-r1-plus
          - xunlong_orangepi-r1-plus-lts
        required: true
        default: 'friendlyarm_nanopi-r3s'
      rootfs_partsize:
        description: '设置软件包大小 单位(MB)'
        required: true
        default: '1024'
      enable_store:
        description: "集成 store 商店"
        required: false
        type: boolean
        default: true
      include_docker:
        description: |
          是否编译 Docker 插件
        required: true
        default: 'yes'
        type: choice
        options:
          - 'yes'
          - 'no'
      enable_pppoe:
        description: "是否配置PPPoE拨号信息?"
        required: true
        default: 'no'
        type: choice
        options:
        - 'yes'
        - 'no'
      pppoe_account:
        description: "宽带账号 (若启用PPPoE)"
        required: false
      pppoe_password:
        description: "宽带密码 (若启用PPPoE)"
        required: false

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set executable permissions for repo scripts
        run: chmod +x ${{ github.workspace }}/rockchip/build24.sh || true

      # ✅ 追加必须的系统工具与可选 docker 到自定义包；这样 ImageBuilder 会打进固件
      - name: Ensure required packages & optional store/docker
        shell: bash
        run: |
          # 确保自定义包脚本存在
          mkdir -p shell
          touch shell/custom-packages.sh

          # 必备：分区 & FS 工具 + 挂载
          if ! grep -q 'parted' shell/custom-packages.sh 2>/dev/null; then
            echo 'CUSTOM_PACKAGES="$CUSTOM_PACKAGES parted fdisk e2fsprogs resize2fs kmod-fs-ext4 block-mount"' >> shell/custom-packages.sh
          fi

          # 可选：应用商店
          if [ "${{ github.event.inputs.enable_store }}" == "true" ]; then
            if ! grep -q 'luci-app-store' shell/custom-packages.sh 2>/dev/null; then
              echo 'CUSTOM_PACKAGES="$CUSTOM_PACKAGES luci-app-store"' >> shell/custom-packages.sh
            fi
            echo "✅ 已启用 luci-app-store"
          else
            echo "❎ 未启用 luci-app-store"
          fi

          # 可选：Docker（这里兜底追加；原 build.sh 若已处理不会冲突）
          if [ "${{ github.event.inputs.include_docker }}" == "yes" ]; then
            if ! grep -q 'dockerd' shell/custom-packages.sh 2>/dev/null; then
              echo 'CUSTOM_PACKAGES="$CUSTOM_PACKAGES dockerd docker luci-app-dockerman"' >> shell/custom-packages.sh
            fi
            echo "✅ 已启用 Docker 相关包"
          else
            echo "❎ 未启用 Docker"
          fi

      # ✅ 保障 .config 至少打开 ext4-sdcard 与 gzip；其余仍由项目现有配置控制
      - name: Patch .config defaults (ext4 + gzip)
        run: |
          # 基础配置文件在 rockchip/imm.config 挂进容器，这里先补充兜底项
          echo 'CONFIG_TARGET_ROOTFS_EXT4FS=y' >> rockchip/imm.config
          echo 'CONFIG_TARGET_IMAGES_GZIP=y'   >> rockchip/imm.config

      # ✅ 关键：确保 autopart 脚本是可执行的（你是网页端创建，默认 644）
      - name: Ensure autopart executable
        run: |
          mkdir -p files/etc/init.d
          chmod +x files/etc/init.d/autopart

      - name: Validate PPPoE Inputs
        run: |
          if [[ "${{ inputs.enable_pppoe }}" == "yes" ]]; then
            if [[ -z "${{ inputs.pppoe_account }}" || -z "${{ inputs.pppoe_password }}" ]]; then
              echo "Error: PPPoE account and password must be provided when PPPoE is enabled!"
              exit 1
            fi
          fi

      - name: Building Rockchip ImmortalWrt
        run: |
          profiles="${{ github.event.inputs.profile }}"
          include_docker="${{ github.event.inputs.include_docker }}"
          rootfs_partsize="${{ github.event.inputs.rootfs_partsize }}"
          
          IFS=',' read -r -a profile_array <<< "$profiles"
          
          for profile in "${profile_array[@]}"; do
            echo "Building for profile: $profile"
            
            docker run --rm -i \
              --user root \
              -v "${{ github.workspace }}/bin:/home/build/immortalwrt/bin" \
              -v "${{ github.workspace }}/files/etc/uci-defaults:/home/build/immortalwrt/files/etc/uci-defaults" \
              -v "${{ github.workspace }}/files/etc/init.d:/home/build/immortalwrt/files/etc/init.d" \  # ← 新增挂载，打包 autopart
              -v "${{ github.workspace }}/arch/arch.conf:/home/build/immortalwrt/files/etc/opkg/arch.conf" \
              -v "${{ github.workspace }}/rockchip/imm.config:/home/build/immortalwrt/.config" \
              -v "${{ github.workspace }}/shell:/home/build/immortalwrt/shell" \
              -v "${{ github.workspace }}/rockchip/build24.sh:/home/build/immortalwrt/build.sh" \
              -e PROFILE=$profile \
              -e INCLUDE_DOCKER=$include_docker \
              -e ROOTFS_PARTSIZE=$rootfs_partsize \
              -e ENABLE_PPPOE=${{ inputs.enable_pppoe }} \
              -e PPPOE_ACCOUNT=${{ inputs.pppoe_account }} \
              -e PPPOE_PASSWORD=${{ inputs.pppoe_password }} \
              immortalwrt/imagebuilder:rockchip-armv8-openwrt-24.10.2 /bin/bash /home/build/immortalwrt/build.sh
          done

      - name: Upload ImmortWrt as release assets
        uses: softprops/action-gh-release@v2.2.1
        with:
          tag_name: Autobuild
          name: ImmortWrt-Rockchip
          body_path: ${{ github.workspace }}/info.md
          files: |
            ${{ github.workspace }}/bin/targets/rockchip/armv8/*.img.gz
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
